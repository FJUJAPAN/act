<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ACT Tower AR • LocAR</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
canvas{position:fixed;inset:0;width:100%!important;height:100%!important}
#hud{
  position:fixed;z-index:50;top:max(12px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);width:min(94vw,620px);padding:10px 14px;border-radius:14px;
  background:rgba(0,0,0,.64);color:#fff;text-align:center;font-size:14px;line-height:1.42;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);pointer-events:none;
}
#detail{font-size:12px;opacity:.82}
#start{
  position:fixed;z-index:100;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));
  transform:translateX(-50%);border:0;border-radius:999px;padding:15px 24px;
  background:#fff;color:#111;font-size:17px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.3);
}
#start.hidden{display:none}
#error{
  position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(90vw,520px);padding:18px;border-radius:16px;background:rgba(120,0,0,.88);
  color:#fff;text-align:center;display:none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.181.0",
    "locar": "https://esm.sh/locar@0.2.12?external=three"
  }
}
</script>
</head>

<body>

<div id="hud">
  ACT Tower AR • LocAR<br>
  <span id="distance">Toque em “Ativar AR”</span><br>
  <span id="detail">Depois aponte para a torre e mova o celular devagar.</span>
</div>

<button id="start">Ativar AR</button>
<div id="error"></div>

<video
  id="sourceVideo"
  src="./assets/video.mp4"
  muted
  loop
  playsinline
  webkit-playsinline
  preload="auto"
  style="display:none">
</video>

<script type="module">
import * as THREE from "three";
import { App } from "locar";

const ACT_LAT = 34.705056;
const ACT_LON = 137.735694;

// Vídeo vertical 9:16
const VIDEO_WIDTH_M  = 67.5;
const VIDEO_HEIGHT_M = 120;

// Altura virtual acima da referência da câmera.
const VIDEO_ELEV = 220;
const MARKER_ELEV = 255;

const startBtn = document.querySelector("#start");
const distanceEl = document.querySelector("#distance");
const detailEl = document.querySelector("#detail");
const errorEl = document.querySelector("#error");
const sourceVideo = document.querySelector("#sourceVideo");

let app = null;
let locar = null;
let videoMesh = null;
let marker = null;
let soundUnlocked = false;

function showError(msg){
  errorEl.textContent = msg;
  errorEl.style.display = "block";
}

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const p1 = toRad(lat1), p2 = toRad(lat2);
  const dp = toRad(lat2-lat1), dl = toRad(lon2-lon1);
  const a = Math.sin(dp/2)**2 +
            Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function requestMotionPermission(){
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    const r = await DeviceOrientationEvent.requestPermission();
    if (r !== "granted") throw new Error("Permissão dos sensores não autorizada.");
  }
}

async function unlockVideoAudio(){
  try{
    sourceVideo.muted = false;
    await sourceVideo.play();
    soundUnlocked = true;
    return true;
  }catch(e){
    sourceVideo.muted = true;
    try{ await sourceVideo.play(); }catch(_){}
    return false;
  }
}

function makeVideoMesh(){
  const texture = new THREE.VideoTexture(sourceVideo);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  const geometry = new THREE.PlaneGeometry(VIDEO_WIDTH_M, VIDEO_HEIGHT_M);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    side: THREE.DoubleSide,
    toneMapped: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = "ACT_VIDEO";
  return mesh;
}

function makeMarker(){
  const geo = new THREE.SphereGeometry(12, 24, 16);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffff00,
    side: THREE.DoubleSide
  });
  const m = new THREE.Mesh(geo, mat);
  m.name = "TEST_MARKER";
  return m;
}

function faceCameraLoop(){
  if(app && app.camera){
    if(videoMesh){
      // Painel sempre paralelo à tela/câmera.
      videoMesh.quaternion.copy(app.camera.quaternion);
    }
  }
  requestAnimationFrame(faceCameraLoop);
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  startBtn.textContent = "Abrindo…";
  detailEl.textContent = "Solicitando câmera, localização e sensores…";

  try {
    // No iPhone precisa acontecer dentro do toque.
    await requestMotionPermission();
    await unlockVideoAudio();

    app = new App({
      cameraOptions: {
        hFov: 80,
        near: 0.01,
        far: 5000
      },
      gpsOptions: {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 20000
      },
      videoConstraints: {
        video: { facingMode: "environment" }
      }
    });

    locar = await app.start();

    // Cria conteúdo só depois que o motor AR iniciou.
    videoMesh = makeVideoMesh();
    marker = makeMarker();

    locar.add(videoMesh, ACT_LON, ACT_LAT, VIDEO_ELEV);
    locar.add(marker, ACT_LON, ACT_LAT, MARKER_ELEV);

    locar.on("gpserror", (ev) => {
      detailEl.textContent = "Erro no GPS. Verifique Localização Precisa.";
    });

    locar.on("gpsupdate", (ev) => {
      const c = ev.position.coords;
      const d = haversine(c.latitude, c.longitude, ACT_LAT, ACT_LON);

      distanceEl.textContent =
        d < 1000
        ? `ACT Tower: aproximadamente ${Math.round(d)} m`
        : `ACT Tower: aproximadamente ${(d/1000).toFixed(1)} km`;

      detailEl.textContent =
        `GPS ±${Math.round(c.accuracy)} m • vídeo 67,5 × 120 m • procure também a esfera amarela`;
    });

    const gpsStarted = await locar.startGps();
    if(!gpsStarted){
      throw new Error("O GPS não iniciou.");
    }

    // Garante vídeo tocando após permissões.
    sourceVideo.muted = !soundUnlocked;
    sourceVideo.play().catch(()=>{});

    startBtn.classList.add("hidden");
    faceCameraLoop();

  } catch (e) {
    console.error(e);
    startBtn.disabled = false;
    startBtn.textContent = "Tentar novamente";
    showError(
      "Não foi possível iniciar o AR. " +
      (e?.message || "Verifique câmera, localização e sensores.")
    );
  }
});
</script>

</body>
</html>
