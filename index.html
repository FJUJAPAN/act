<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ACT Tower AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>

<!-- AR.js 3.4.8: location-based com correções recentes para iOS -->
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

<style>
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
#hud{
  position:fixed;z-index:3000;
  top:max(12px,env(safe-area-inset-top));
  left:50%;transform:translateX(-50%);
  width:min(94vw,620px);
  padding:10px 14px;border-radius:14px;
  background:rgba(0,0,0,.62);color:#fff;
  text-align:center;font-size:14px;line-height:1.42;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  pointer-events:none
}
#status{font-size:12px;opacity:.82}
#sound{
  position:fixed;z-index:3001;
  left:50%;
  bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));
  transform:translateX(-50%);
  border:0;border-radius:999px;
  padding:13px 20px;background:#fff;color:#111;
  font-size:16px;font-weight:800;
  box-shadow:0 8px 30px rgba(0,0,0,.3)
}
#sound.hidden{display:none}
</style>
</head>

<body>

<div id="hud">
  Aponte para a ACT Tower e mova o celular lentamente.<br>
  <span id="distance">Obtendo GPS…</span><br>
  <span id="status">Carregando vídeo…</span>
</div>

<button id="sound">🔊 Ativar som</button>

<a-scene
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; videoTexture:true; debugUIEnabled:false;"
  renderer="antialias:true; alpha:true;">

  <a-assets timeout="30000">
    <video
      id="arVideo"
      src="./assets/video.mp4"
      preload="auto"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <!--
    COORDENADA CORRIGIDA DA ACT TOWER:
    34.70555, 137.73719
  -->

  <!-- Vídeo vertical 9:16 -->
  <a-entity
    id="videoAnchor"
    gps-new-entity-place="latitude:34.70555; longitude:137.73719"
    position="0 210 0"
    look-at="[gps-new-camera]">

    <a-plane
      id="videoPlane"
      width="67.5"
      height="120"
      material="src:#arVideo; shader:flat; side:double;">
    </a-plane>

  </a-entity>

  <!-- Esfera de diagnóstico, visível de qualquer ângulo -->
  <a-sphere
    id="marker"
    gps-new-entity-place="latitude:34.70555; longitude:137.73719"
    position="0 235 0"
    radius="10"
    material="color:#ffff00; emissive:#ffff00; emissiveIntensity:1;">
  </a-sphere>

  <a-camera
    id="camera"
    gps-new-camera="gpsMinDistance:3; positionMinAccuracy:100"
    camera="far:5000"
    look-controls-enabled="false"
    arjs-device-orientation-controls="smoothingFactor:0.1">
  </a-camera>

</a-scene>

<script>
window.addEventListener("DOMContentLoaded",()=>{
  const video=document.querySelector("#arVideo");
  const plane=document.querySelector("#videoPlane");
  const anchor=document.querySelector("#videoAnchor");
  const camera=document.querySelector("#camera");
  const distance=document.querySelector("#distance");
  const status=document.querySelector("#status");
  const sound=document.querySelector("#sound");

  // Mantém a proporção real 1080x1920 = 9:16.
  video.addEventListener("loadedmetadata",()=>{
    if(video.videoWidth && video.videoHeight){
      const h=120;
      const w=h*(video.videoWidth/video.videoHeight);
      plane.setAttribute("width",w);
      plane.setAttribute("height",h);
    }
  });

  video.addEventListener("canplay",()=>{
    status.textContent="✓ Vídeo carregado";
    video.play().catch(()=>{});
  });

  video.addEventListener("playing",()=>{
    status.textContent="✓ Vídeo reproduzindo";
  });

  video.addEventListener("error",()=>{
    status.textContent="⚠️ Erro em assets/video.mp4";
  });

  sound.addEventListener("click",async()=>{
    try{
      video.muted=false;
      await video.play();
      sound.classList.add("hidden");
      status.textContent="✓ Vídeo + som ativos";
    }catch(e){
      status.textContent="⚠️ Toque novamente para ativar o som";
    }
  });

  camera.addEventListener("gps-camera-update-position",()=>{
    const comp=anchor.components["gps-new-entity-place"];

    if(comp && typeof comp.distance==="number"){
      const d=comp.distance;
      distance.textContent=d<1000
        ? `ACT Tower: aproximadamente ${Math.round(d)} m`
        : `ACT Tower: aproximadamente ${(d/1000).toFixed(1)} km`;
    }else{
      distance.textContent="GPS ativo";
    }
  });

  setTimeout(()=>{
    video.muted=true;
    video.play().catch(()=>{});
  },1000);
});
</script>

</body>
</html>
