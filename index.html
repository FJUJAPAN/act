<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ACT Tower AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

<script>
AFRAME.registerComponent('billboard-camera', {
  init: function () {
    this.cameraEl = document.querySelector('[gps-new-camera]');
    this.target = new THREE.Vector3();
  },
  tick: function () {
    if (!this.cameraEl || !this.cameraEl.object3D) return;
    this.cameraEl.object3D.getWorldPosition(this.target);
    this.el.object3D.lookAt(this.target);
  }
});
</script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#info{position:fixed;z-index:3000;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92vw,600px);padding:11px 14px;border-radius:14px;background:rgba(0,0,0,.62);color:#fff;text-align:center;font-size:14px;line-height:1.45;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);pointer-events:none}
#status{opacity:.85;font-size:13px}
#sound{position:fixed;z-index:3001;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);border:0;border-radius:999px;padding:13px 20px;background:#fff;color:#111;font-size:16px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#sound.hidden{display:none}
</style>
</head>

<body>

<div id="info">
  Aponte para a ACT Tower e também um pouco acima dela.<br>
  <span id="distance">Obtendo GPS…</span><br>
  <span id="status">Carregando vídeo…</span>
</div>

<button id="sound">🔊 Ativar som</button>

<a-scene
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; videoTexture:true; debugUIEnabled:false;"
  renderer="antialias:true; alpha:true;">

  <a-assets timeout="30000">
    <video id="arVideo"
      src="./assets/video.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-entity
    id="anchor"
    gps-new-entity-place="latitude:34.705056; longitude:137.735694"
    position="0 215 0"
    billboard-camera>

    <a-plane
      width="126"
      height="76"
      position="0 0 -0.5"
      material="color:#ffffff; opacity:0.28; transparent:true; side:double">
    </a-plane>

    <a-plane
      id="videoPlane"
      width="120"
      height="67.5"
      material="src:#arVideo; shader:flat; side:double; transparent:false">
    </a-plane>

  </a-entity>

  <a-camera
    id="cam"
    camera="far:5000"
    look-controls-enabled="false"
    arjs-device-orientation-controls="smoothingFactor:0.1"
    gps-new-camera="gpsMinDistance:3; positionMinAccuracy:100">
  </a-camera>

</a-scene>

<script>
window.addEventListener("DOMContentLoaded",()=>{
  const video=document.querySelector("#arVideo");
  const plane=document.querySelector("#videoPlane");
  const anchor=document.querySelector("#anchor");
  const cam=document.querySelector("#cam");
  const distance=document.querySelector("#distance");
  const status=document.querySelector("#status");
  const sound=document.querySelector("#sound");

  video.addEventListener("loadedmetadata",()=>{
    const w=120;
    if(video.videoWidth && video.videoHeight){
      plane.setAttribute("height", w*(video.videoHeight/video.videoWidth));
    }
  });

  video.addEventListener("canplay",()=>{
    status.textContent="✓ Vídeo carregado";
    video.play().catch(()=>{});
  });

  video.addEventListener("playing",()=>{
    status.textContent="✓ Vídeo reproduzindo";
  });

  video.addEventListener("error",()=>{
    status.textContent="⚠️ ERRO: assets/video.mp4 não carregou";
  });

  sound.addEventListener("click", async()=>{
    try{
      video.muted=false;
      await video.play();
      sound.classList.add("hidden");
      status.textContent="✓ Vídeo + som ativos";
    }catch(e){
      status.textContent="⚠️ Toque novamente para ativar o vídeo";
    }
  });

  cam.addEventListener("gps-camera-update-position",()=>{
    const comp=anchor.components["gps-new-entity-place"];
    if(comp && typeof comp.distance==="number"){
      const d=comp.distance;
      distance.textContent = d<1000
        ? `ACT Tower: aproximadamente ${Math.round(d)} m`
        : `ACT Tower: aproximadamente ${(d/1000).toFixed(1)} km`;
    }else{
      distance.textContent="GPS ativo";
    }
  });

  setTimeout(()=>{
    video.muted=true;
    video.play().catch(()=>{});
  },1200);
});
</script>

</body>
</html>
